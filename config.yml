# config.yaml


# Configuración general
images:
  # Directorios raíz (opcionales – tienen valores por defecto si faltan)
  src: "./imgsProcesar"
  dst: "./outputImgs"

  # === Preprocesado “anticopyright” ===
  convert_to_png:  true  
  upscale:         true   
  invert:          true  
  brightness_factor:  1.05
  contrast_factor:    1.10
  saturation_factor:  1.15
  resize_generic:   [50, 50]   # ancho × alto exacto

  # === Pasos nuevos de calidad de salida ===
  dpi:                200

icons:
  # Directorios raíz (opcionales – tienen valores por defecto si faltan)
  src: "./iconosProcesar"
  dst: "./outputIcons"
  # === Pipeline SVG ===
  copy_svg:           true 
  dpi:                300

  # Máximos por categoría
  max_size:
    group:            [100, 100]


  # White-wash para iconos rasterizados
  white_replace:      true
  white_src:          [255, 255, 255]
  white_dst:          [235, 235, 235]
